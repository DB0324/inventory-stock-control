[pytest]
# config.settings.test, not .dev -- dev points at Neon, and pytest-django
# creates and drops the database it is given. See the guard in test.py.
DJANGO_SETTINGS_MODULE = config.settings.test
python_files = test_*.py
markers =
    concurrency: real threads on separate connections; slow
    property: Hypothesis; slow

# --reuse-db skips the create/migrate cycle between runs, which is the
# difference between a suite that gets run constantly and one that doesn't.
# Pass --create-db by hand after a migration changes the schema.
addopts = --reuse-db
